<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d0a18">
<meta name="mobile-web-app-capable" content="yes">
<title>Adda Arena</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-96.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="tb-profile" id="tbProfile">
      <span class="ava" id="tbAva">🦊</span>
      <span class="tb-name" id="tbName">অতিথি</span>
    </button>
    <div class="tb-coin" id="tbCoin"><span>🪙</span><b id="tbCoinVal">0</b></div>
  </header>

  <main id="screen"></main>

  <nav class="tabbar">
    <button class="tab active" data-tab="home"><span>🏠</span><i>হোম</i></button>
    <button class="tab" data-tab="games"><span>🎮</span><i>গেম</i></button>
    <button class="tab" data-tab="store"><span>🛍️</span><i>স্টোর</i></button>
    <button class="tab" data-tab="profile"><span>👤</span><i>প্রোফাইল</i></button>
  </nav>
</div>

<div id="toast" class="toast"></div>
<div id="modalRoot"></div>

<script src="js/store.js"></script>
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script>
  window.Games = [];
  window.registerGame = function (g) { window.Games.push(g); };
</script>
<script src="js/games/spy.js"></script>
<script src="js/games/snakes.js"></script>
<script src="js/games/tictactoe.js"></script>
<script src="js/games/wordchain.js"></script>
<script src="js/games/quiz.js"></script>
<script src="js/games/memory.js"></script>
<script src="js/games/truthdare.js"></script>
<script src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
